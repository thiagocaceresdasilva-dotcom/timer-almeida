plugins { id 'com.android.application' }
android {
    namespace 'br.com.almeidajj.timer'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.almeidajj.timer'
        minSdk 22
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        // APK de release assinado com a chave de debug: instala direto no Fire TV
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
